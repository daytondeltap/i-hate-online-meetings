name: Build NetToggle macOS app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native app and DMG
        shell: bash
        run: |
          chmod +x macOS/INSTALL-NETTOGGLE.command
          NETTOGGLE_BUILD_ONLY=1 ./macOS/INSTALL-NETTOGGLE.command

      - name: Verify app and package
        shell: bash
        run: |
          test -x macOS/dist/NetToggle.app/Contents/MacOS/NetToggle
          /usr/bin/codesign --verify --deep --strict macOS/dist/NetToggle.app
          test -f macOS/dist/NetToggle-1.3-macOS.dmg
          /usr/bin/ditto -c -k --keepParent macOS/dist/NetToggle.app NetToggle-1.3-macOS-app.zip
          /usr/bin/shasum -a 256 NetToggle-1.3-macOS-app.zip macOS/dist/NetToggle-1.3-macOS.dmg > SHA256SUMS.txt

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetToggle-1.3-macOS-app
          path: NetToggle-1.3-macOS-app.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetToggle-1.3-macOS-dmg
          path: macOS/dist/NetToggle-1.3-macOS.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.3-build-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            NetToggle-1.3-macOS-app.zip \
            macOS/dist/NetToggle-1.3-macOS.dmg \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "NetToggle 1.3 for macOS" \
            --notes "Ready-to-install macOS build. Download the DMG, open it, and drag NetToggle.app to Applications. This build is ad-hoc signed rather than Apple-notarized, so first launch may require Control-click/Right-click > Open. NetToggle requests administrator permission at launch for its local network controls."
