name: Build and release ihatemeetings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Windows/**', 'macOS/**', '.github/workflows/build.yml', 'RELEASE-NOTES.md']
permissions:
  contents: read
concurrency:
  group: ihatemeetings-release
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test timing and validate PF rule syntax
        run: |
          swiftc -swift-version 5 macOS/source/Timing.swift macOS/tests/main.swift -o /tmp/test-timing
          /tmp/test-timing
          /tmp/test-timing --rules > /tmp/meet-rules.conf
          sudo /sbin/pfctl -n -a com.apple/ihatemeetings-test -f /tmp/meet-rules.conf
      - name: Build universal app and DMG
        run: bash macOS/build.sh
      - name: Verify bundle and disk image
        run: |
          lipo macOS/dist/ihatemeetings.app/Contents/MacOS/ihatemeetings -verify_arch arm64 x86_64
          codesign --verify --deep --strict macOS/dist/ihatemeetings.app
          hdiutil verify macOS/dist/ihatemeetings-1.4-macOS-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            macOS/dist/ihatemeetings-1.4-macOS-universal.dmg
            macOS/dist/ihatemeetings-1.4-macOS-app.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Test and compile
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd Windows/source
          g++ -std=c++17 -Wall -Wextra -Werror test_cycle.cpp -o test-cycle.exe
          ./test-cycle.exe
          windres -I . app.rc -O coff -o app.res
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -static -static-libgcc -static-libstdc++ -municode -mwindows main.cpp app.res -o ../ihatemeetings.exe -liphlpapi -lsetupapi -lcfgmgr32 -lfwpuclnt -lrpcrt4 -lcomctl32 -lshell32 -lole32 -luuid -lws2_32 -lwinmm
          strip ../ihatemeetings.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Windows/ihatemeetings.exe
  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Package sources and checksums
        run: |
          set -euo pipefail
          git archive --format=zip --output=release-assets/ihatemeetings-1.4-Windows-source.zip HEAD Windows
          git archive --format=zip --output=release-assets/ihatemeetings-1.4-macOS-source.zip HEAD macOS
          git archive --format=zip --output=release-assets/ihatemeetings-1.4-all-source.zip HEAD
          cd release-assets
          sha256sum *.zip *.exe *.dmg > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.4.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published artifacts.' >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "ihatemeetings 1.4 — Windows and macOS" --notes-file RELEASE-NOTES.md --latest
