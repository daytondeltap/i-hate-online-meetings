name: Build NetToggle macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'macOS/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: nettoggle-macos-release
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native app and DMG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x macOS/INSTALL-NETTOGGLE.command
          NETTOGGLE_BUILD_ONLY=1 ./macOS/INSTALL-NETTOGGLE.command

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          test -x macOS/dist/NetToggle.app/Contents/MacOS/NetToggle
          /usr/bin/codesign --verify --deep --strict --verbose=2 macOS/dist/NetToggle.app
          test -f macOS/dist/NetToggle-1.3-macOS.dmg

          /usr/bin/ditto -c -k --keepParent             macOS/dist/NetToggle.app             macOS/dist/NetToggle-1.3-macOS-app.zip

          /usr/bin/shasum -a 256             macOS/dist/NetToggle-1.3-macOS-app.zip             macOS/dist/NetToggle-1.3-macOS.dmg             > macOS/dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetToggle-1.3-macOS
          path: |
            macOS/dist/NetToggle-1.3-macOS-app.zip
            macOS/dist/NetToggle-1.3-macOS.dmg
            macOS/dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.3"
          NOTES=$'Native NetToggle 1.3 macOS build.\n\nRecommended install: download NetToggle-1.3-macOS.dmg, open it, then drag NetToggle.app into Applications.\n\nThe app is ad-hoc signed rather than Apple-notarized, so macOS may require Control-click/Right-click > Open the first time.'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               macOS/dist/NetToggle-1.3-macOS-app.zip               macOS/dist/NetToggle-1.3-macOS.dmg               macOS/dist/SHA256SUMS.txt               --clobber
          else
            gh release create "$TAG"               macOS/dist/NetToggle-1.3-macOS-app.zip               macOS/dist/NetToggle-1.3-macOS.dmg               macOS/dist/SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "NetToggle 1.3 for macOS"               --notes "$NOTES"
          fi
