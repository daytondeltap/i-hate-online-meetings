name: Bootstrap NetToggle macOS release
# source-only bootstrap retry

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore source and icon
        shell: bash
        run: |
          mkdir -p macOS/source macOS/resources
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def restore(parts, output):
              data = b"".join(base64.b64decode(Path(p).read_text().strip()) for p in parts)
              Path(output).write_bytes(data)

          restore([".bootstrap/main0.b64", ".bootstrap/main1.b64"], "macOS/source/main.swift")
          # App icon is optional for the native build; skip binary transfer during bootstrap.
          PY
          test "$(shasum -a 256 macOS/source/main.swift | awk '{print $1}')" = "85f256b27ecfaa3ef0d44ffc5e45ddd860cd314fb514b44c095e4902f2d1ba7f"

      - name: Build native app and DMG
        shell: bash
        run: |
          chmod +x macOS/INSTALL-NETTOGGLE.command
          NETTOGGLE_BUILD_ONLY=1 ./macOS/INSTALL-NETTOGGLE.command

      - name: Verify and package
        shell: bash
        run: |
          test -x macOS/dist/NetToggle.app/Contents/MacOS/NetToggle
          /usr/bin/codesign --verify --deep --strict macOS/dist/NetToggle.app
          test -f macOS/dist/NetToggle-1.3-macOS.dmg
          /usr/bin/ditto -c -k --keepParent macOS/dist/NetToggle.app NetToggle-1.3-macOS-app.zip
          /usr/bin/shasum -a 256 NetToggle-1.3-macOS-app.zip macOS/dist/NetToggle-1.3-macOS.dmg > SHA256SUMS.txt

      - name: Commit clean source tree
        shell: bash
        run: |
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macOS/source/main.swift
          git add -u .bootstrap
          git commit -m "Restore NetToggle macOS source from uploaded package"
          git push origin HEAD:main

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetToggle-1.3-macOS-app
          path: NetToggle-1.3-macOS-app.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetToggle-1.3-macOS-dmg
          path: macOS/dist/NetToggle-1.3-macOS.dmg

      - name: Publish initial GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.3-initial-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            NetToggle-1.3-macOS-app.zip \
            macOS/dist/NetToggle-1.3-macOS.dmg \
            SHA256SUMS.txt \
            --target main \
            --title "NetToggle 1.3 for macOS" \
            --notes "Ready-to-install macOS build. Download NetToggle-1.3-macOS.dmg, open it, and drag NetToggle.app to Applications. This build is ad-hoc signed rather than Apple-notarized, so first launch may require Control-click/Right-click > Open. NetToggle requests administrator permission at launch for its local network controls."
